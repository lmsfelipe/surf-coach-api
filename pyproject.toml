[project]
name = "surf-coach-api"
version = "0.1.0"
description = "Surf Coaching Platform — FastAPI backend (Phase 1: Auth & Profile)"
requires-python = ">=3.12"
dependencies = [
    # <0.137: from 0.137 included routers stay nested in app.routes, so slowapi's
    # middleware (<=0.1.10) can't resolve the endpoint and silently exempts every
    # route from RATE_LIMIT_DEFAULT. tests/test_rate_limit.py catches this.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "opencv-python-headless>=4.10",
    "supabase>=2.0",
    "python-magic>=0.4",
    "aiofiles>=23.0",
    "python-multipart>=0.0.9",
    "arq>=0.26",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "structlog>=24.0",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Recent ruff also formats Python code blocks inside Markdown. The ones in docs/ are
# spec excerpts and fragments, not runnable code, so keep ruff to real Python files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's dependency-injection idiom is `x = Depends(...)` / `File(...)`
# in the default argument — a function call in a default is intentional here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic migration templates keep the generated import layout.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Import-time wiring with no branching logic of its own.
    "app/models/*",
    "app/schemas/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet: raise this as coverage improves, never lower it to make a build pass.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
