name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: surf_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/surf_coach_test
      APP_ENV: development
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_ANON_KEY: fake-anon-key
      SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key
      SUPABASE_JWT_SECRET: fake-jwt-secret-at-least-32-characters-long
      GEMINI_API_KEY: fake-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # python-magic needs the native libmagic. Without it the media upload and
      # stream tests silently `importorskip` instead of running.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - run: pip install -e ".[dev]"
      - name: Verify libmagic is importable
        run: python -c "import magic; print('libmagic ok')"
      - run: alembic upgrade head
      # DATABASE_URL above points at the service container, so the repository
      # integration tests run here rather than skipping as they do without a DB.
      - name: Verify the repository integration tests are not skipped
        run: |
          pytest tests/test_repositories_integration.py -q --no-header -p no:cacheprovider \
            --no-cov 2>&1 | tee /tmp/repo-tests.log
          if grep -qE "[0-9]+ skipped" /tmp/repo-tests.log; then
            echo "::error::Repository integration tests were skipped — the database is \
          unreachable or unmigrated, so the repository layer went untested."
            exit 1
          fi
      # fail_under (see pyproject.toml [tool.coverage.report]) gates the build.
      - run: pytest --tb=short -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
